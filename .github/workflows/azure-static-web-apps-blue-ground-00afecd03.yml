name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # 1. Forza GitHub a usare Node.js v24 prima di qualsiasi operazione
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 2. Installa le dipendenze ed esegui la build di Angular direttamente su GitHub
      - name: Install dependencies and Build Angular
        run: |
          npm ci
          npm run build -- --configuration=production

      # 3. Invia ad Azure i file statici già pronti saltando la build remota
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_GROUND_00AFECD03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### NUOVA CONFIGURAZIONE DELLA COSTRUZIONE ######
          app_location: "distro"       # Modifica questo valore se la cartella di output di Angular ha un nome diverso (es. "dist/nome-app")
          output_location: ""          # Lascia vuoto per indicare che non serve una build aggiuntiva
          skip_app_build: true         # Indica ad Azure di NON compilare e prendere i file così come sono
          api_location: ""             # Lascia vuoto se non usi Azure Functions
          ###### FINE CONFIGURAZIONE ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_GROUND_00AFECD03 }}
          action: "close"
